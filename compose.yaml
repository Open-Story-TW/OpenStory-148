name: maple-go-local

services:
  postgres:
    image: ${MAPLEGO_POSTGRES_IMAGE:-postgres:18.6-bookworm}
    ports:
      - "127.0.0.1:15432:5432"
    environment:
      POSTGRES_DB: maple_go_local
      POSTGRES_USER: maplego
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    volumes:
      - postgres18:/var/lib/postgresql
      - ./.local/secrets/postgres-password:/run/secrets/postgres_password:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maplego -d maple_go_local"]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  redis:
    image: ${MAPLEGO_REDIS_IMAGE:-redis:8.2-alpine}
    ports:
      - "127.0.0.1:16379:6379"
    command: ["redis-server", "/etc/redis/redis.conf"]
    volumes:
      - ./.local/redis.conf:/etc/redis/redis.conf:ro
      - ./.local/secrets/redis-password:/run/secrets/redis_password:ro
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$(cat /run/secrets/redis_password) redis-cli ping | grep -q PONG"]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped

volumes:
  postgres18:
